kind = "web"
previewPath = "/"
title = "TempDent Dental Nurse Try Day"
description = "A blank TempDent try-day scaffold ready for the approved experience brief and employer content."
version = "1.0.0"
id = "artifacts/try-day"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25213

[services.development]
run = "pnpm --filter @workspace/try-day run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/try-day", "run", "build" ]
serve = "static"
publicDir = "artifacts/try-day/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25213"
BASE_PATH = "/"
